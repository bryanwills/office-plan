# Applied on littlecreek k3s. Listens on the Tailscale address only.
# netcup Traefik proxies https://argo.bryanwills.dev to this port.
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-tailnet
  namespace: argocd
spec:
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 8081
      targetPort: 8080
  externalIPs:
    - 100.85.240.30
