# File on netcup: /opt/stacks/traefik/dynamic/argo.yml
#
# Public name: https://argo.bryanwills.dev
# TLS on netcup Traefik. Backend is k3s Argo CD on littlecreek over Tailscale.
# DNS A argo → 152.53.82.233 (already created).
#
# littlecreek: 100.85.240.30:8081 → argocd-server-tailnet Service → argocd-server
# Previous backend was ai-nuc k3d 100.73.71.29:8081. That cluster was stopped 2026-10-03.
http:
  routers:
    argo-http:
      rule: "Host(`argo.bryanwills.dev`)"
      entryPoints:
        - web
      middlewares:
        - argo-https-redirect
      service: argo

    argo-secure:
      rule: "Host(`argo.bryanwills.dev`)"
      entryPoints:
        - websecure
      service: argo
      tls:
        certResolver: letsencrypt

  middlewares:
    argo-https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    argo:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://100.85.240.30:8081"
        healthCheck:
          path: /
          interval: "15s"
          timeout: "5s"
