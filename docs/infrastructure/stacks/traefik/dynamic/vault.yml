# Static route for Hashicorp Vault (keys.bryanwills.dev). Docker provider is
# disabled on this host — see traefik/docker-compose.yml.
http:
  routers:
    vault-http:
      rule: "Host(`keys.bryanwills.dev`)"
      entryPoints:
        - web
      middlewares:
        - vault-https-redirect
      service: vault

    vault-secure:
      rule: "Host(`keys.bryanwills.dev`)"
      entryPoints:
        - websecure
      service: vault
      tls:
        certResolver: letsencrypt

  middlewares:
    vault-https-redirect:
      redirectScheme:
        scheme: https

  services:
    vault:
      loadBalancer:
        servers:
          - url: "http://vault:8200"
