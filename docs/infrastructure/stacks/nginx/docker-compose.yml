# Nginx + PHP-FPM for the netcup VPS, serving bryanwills.dev and
# bigbraincoding.com. Adapted from Little Creek's
# /home/bryanwi09/docker/nginx/docker-compose.yml.
# Path convention: /opt/stacks/nginx + /opt/stacks/php-fpm (netcup),
# not /home/bryanwi09/docker (Little Creek). Website data lives at
# /var/www/{domain}/html on both hosts (same absolute path, outside /opt/stacks
# since it's host-level web content, not container config).
services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./sites:/etc/nginx/sites-available
      - ./logs:/var/log/nginx
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /var/www/bigbraincoding.com/html:/var/www/bigbraincoding.com/html
      - /var/www/bryanwills.dev:/var/www/bryanwills.dev
    networks:
      - proxy
    depends_on:
      - php-fpm
    # No traefik.* labels: Traefik's docker provider is disabled on this
    # host — see traefik/docker-compose.yml. Routing is defined statically
    # in traefik/dynamic/nginx-sites.yml instead.

  php-fpm:
    image: php:8.4-fpm-alpine
    container_name: php-fpm
    restart: unless-stopped
    volumes:
      - /var/www/bigbraincoding.com/html:/var/www/bigbraincoding.com/html
      - /opt/stacks/php-fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - /opt/stacks/php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf
    networks:
      - proxy
    environment:
      - PHP_FPM_USER=www-data
      - PHP_FPM_GROUP=www-data

networks:
  proxy:
    external: true
