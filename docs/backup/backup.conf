# Copy to backup.conf and edit. backup.conf is gitignored via backups/ patterns;
# keep it next to these scripts or at $HOME/.config/vps-backup.conf

# Where archives land on this VPS (needs free space; you have ~110G)
BACKUP_ROOT="/home/bryanwi09/docker/backups"

# Docker compose / bind-mount tree
DOCKER_ROOT="/home/bryanwi09/docker"

# Website docroots (nginx serves these)
WEB_SITES=(
  "/var/www/bigbraincoding.com"
  "/var/www/bryanwills.dev"
)

# Extra host paths used by running containers (outside DOCKER_ROOT)
EXTRA_DATA_PATHS=(
  "/home/bryanwi09/.affine"
  "/home/bryanwi09/.opengist"
  "/home/bryanwi09/.hermes"
)

# Named Docker volumes worth exporting (skip huge/ephemeral if needed)
# ollama models are ~1.1G — include for restore, exclude if you re-pull models
VOLUME_INCLUDE=(
  "ollama_ollama-models"
  "graylog_mongodb_data"
  "graylog_elasticsearch_data"
  "graylog_graylog_data"
  "rsyslog_rsyslog-data"
  "docmost_portainer_data"
)

# Logical DB dumps (container:user:db) — safer than raw postgres files
POSTGRES_DUMPS=(
  "forgejo-db:forgejo:forgejo"
  "linkwarden-postgres:linkwarden:linkwarden"
  "docmost-postgres:docmost:docmost"
  "affine_postgres:affine:affine"
)

# Retention
DAILY_KEEP_DAYS=14
WEEKLY_KEEP_DAYS=60
VOLUME_KEEP_DAYS=14

# Offsite sync (pick one method in sync-offsite.sh)
# Examples:
#   rsync over SSH/Tailscale:  bryan@100.x.x.x:/backups/vps-primary/
#   rclone remote:             b2:my-bucket/vps-primary
OFFSITE_METHOD="rsync"   # rsync | rclone | none
OFFSITE_TARGET=""        # e.g. user@backup-host:/path/to/backups/
RCLONE_REMOTE=""         # e.g. b2:llc-backups/vps/

# Optional: GPG recipient for encrypting tarballs before offsite sync
# Leave empty to skip encryption
GPG_RECIPIENT=""

# Run hermes backup if hermes is on PATH
BACKUP_HERMES=1
