# Paperless-ngx on ai-nuc. Private to the tailnet — do not publish 0.0.0.0.
#
# Bind only the Tailscale IPv4. MagicDNS name:
#   http://ai-nuc.taild5c0d3.ts.net:8000
#
# Consume folder (drop scans/PDFs here):
#   /mnt/ai-data/paperless/consume
#   (also bind-mounted at /usr/src/paperless/consume inside the container)
#
# Secrets live in /opt/stacks/paperless/.env on the NUC (mode 600), never in git.

services:
  broker:
    image: docker.io/library/redis:7
    container_name: paperless-broker
    restart: unless-stopped
    volumes:
      - /opt/stacks/paperless/redis:/data

  db:
    image: docker.io/library/postgres:16
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS}
    volumes:
      - /opt/stacks/paperless/pgdata:/var/lib/postgresql/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "100.73.71.29:8010:8000"
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_BIND_ADDR: "0.0.0.0"
      PAPERLESS_URL: http://ai-nuc.taild5c0d3.ts.net:8010
      PAPERLESS_ALLOWED_HOSTS: ai-nuc,ai-nuc.taild5c0d3.ts.net,100.73.71.29,localhost
      PAPERLESS_CORS_ALLOWED_HOSTS: http://ai-nuc.taild5c0d3.ts.net:8010,http://100.73.71.29:8010,http://ai-nuc:8010
      PAPERLESS_CSRF_TRUSTED_ORIGINS: http://ai-nuc.taild5c0d3.ts.net:8010,http://100.73.71.29:8010,http://ai-nuc:8010
      PAPERLESS_TIME_ZONE: America/New_York
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-bryan}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_ADMIN_MAIL: bryan@bryanwills.dev
      PAPERLESS_FILENAME_FORMAT: "{created_year}/{correspondent}/{title}"
      USERMAP_UID: ${PAPERLESS_UID:-1000}
      USERMAP_GID: ${PAPERLESS_GID:-1000}
    volumes:
      - /opt/stacks/paperless/data:/usr/src/paperless/data
      - /opt/stacks/paperless/media:/usr/src/paperless/media
      - /opt/stacks/paperless/export:/usr/src/paperless/export
      - /opt/stacks/paperless/consume:/usr/src/paperless/consume
